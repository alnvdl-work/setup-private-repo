name: Setup private repo
author: alnvdl-work
description: |
  setup-private-repo is a GitHub action that Clones a private GitHub repo using
  an SSH deploy key or personal access token, and configures Git to use that
  local copy instead. See the README for more details:
    https://github.com/alnvdl-work/setup-private-repo

inputs:
  repository:
    required: true
    type: string
    description: |
      The fully-qualified name of the GitHub repository, for example:
        alnvdl-work/setup-private-repo
  token:
    required: false
    type: string
    default: ""
    description: |
      A (preferrably fine-grained) personal access token to use for cloning the
      private repo via HTTPS. For more details, see the README at:
        https://github.com/alnvdl-work/setup-private-repo
  ssh-key:
    required: false
    type: string
    default: ""
    description: |
      A private SSH key to use for cloning the private repo. For more details,
      see the README at:
        https://github.com/alnvdl-work/setup-private-repo
  directory:
    required: false
    type: string
    default: ""
    description: |
      A path relative to $GITHUB_WORKSPACE under which the private repo will be
      set up. If empty, the private repo is set up directly under
      $GITHUB_WORKSPACE. For example, setting it to "my-project" results in the
      private repo being cloned to:
        $GITHUB_WORKSPACE/my-project/.private-repos/<repository>

runs:
  using: composite
  steps:
  - name: Setting up folder structure
    env:
      REPO: ${{ inputs.repository }}
      DIRECTORY: ${{ inputs.directory }}
    run: mkdir -p "$GITHUB_WORKSPACE/${DIRECTORY:+$DIRECTORY/}.private-repos/$REPO"
    shell: bash
  - name: Cloning private repository
    uses: actions/checkout@v4
    with:
      repository: ${{ inputs.repository }}
      token: ${{ inputs.token || github.token }}
      ssh-key: ${{ inputs.ssh-key }}
      path: ${{ inputs.directory && format('{0}/', inputs.directory) || '' }}.private-repos/${{ inputs.repository }}
      fetch-depth: 0
  - name: Adding tag to enable lookups based on what was checked-out
    env:
      REPO: ${{ inputs.repository }}
      DIRECTORY: ${{ inputs.directory }}
    run: |
      cd "$GITHUB_WORKSPACE/${DIRECTORY:+$DIRECTORY/}.private-repos/$REPO"
      git tag setup-private-repo
    shell: bash
  - name: Configuring git to use the local copy of the private repo
    env:
      REPO: ${{ inputs.repository }}
      DIRECTORY: ${{ inputs.directory }}
    run: |
      git config --global "url.file://$GITHUB_WORKSPACE/${DIRECTORY:+$DIRECTORY/}.private-repos/$REPO.insteadOf" "https://github.com/$REPO"
    shell: bash
